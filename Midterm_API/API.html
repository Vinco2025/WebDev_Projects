<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to Valorant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/valorant/default.svg">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets3/css3/style.css">
</head>

<body>

    <div class="container-fluid shadow mb-4" style="background-color: var(--val-red);">
        <div class="container">
            <div class="row align-items-center py-2">
                <div class="col-md-4 d-flex align-items-center justify-content-center justify-content-md-start mb-2 mb-md-0">
                    <img src="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/valorant/default.svg" 
                        alt="Valorant" 
                        style="height: 32px; margin-right: 12px; filter: brightness(0) invert(1);" 
                        onerror="this.style.display='none'">
                    <span class="h4 text-white m-0" style="letter-spacing: 1px; font-weight: 600;">VALORANT</span>
                </div>

                <div class="col-md-8">
                    <ul class="nav justify-content-center justify-content-md-end">
                        <li class="nav-item">
                            <a class="nav-link text-white fw-semibold active" href="#" onclick="switchTab('agents', this)">Agents</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="#" onclick="switchTab('maps', this)">Maps</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white-50" href="#" onclick="switchTab('arsenal', this)">Arsenal</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div id="agentControls" class="container mb-4">
        <div class="row g-3 align-items-center justify-content-between">
            <div class="col-12 col-md-3">
                <div class="input-group">
                    <label class="input-group-text bg-dark text-white border-secondary" for="roleFilter" style="font-weight: 600;">Role</label>
                    <select class="form-select" id="roleFilter" onchange="filterRole()">
                        <option value="ALL">All Roles</option>
                        <option value="Duelist">Duelist</option>
                        <option value="Initiator">Initiator</option>
                        <option value="Controller">Controller</option>
                        <option value="Sentinel">Sentinel</option>
                    </select>
                </div>
            </div>
            <div class="col-12 col-md-6 d-flex justify-content-md-end justify-content-center">
                <nav aria-label="Agent pagination">
                    <ul class="pagination mb-0">
                        <li class="page-item" id="btnPrev"><a class="page-link" onclick="prev()">Previous</a></li>
                        <li class="page-item"><span class="page-link" id="currentPage">1 / 1</span></li>
                        <li class="page-item" id="btnNext"><a class="page-link" onclick="next()">Next</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <div id="mapsControls" class="container mb-4" style="display: none;">
        <div class="row g-3 align-items-center justify-content-between">
            <div class="col-12 col-md-3">
                <div class="input-group">
                    <label class="input-group-text bg-dark text-white border-secondary" for="mapFilter">Map Pool</label>
                    <select class="form-select" id="mapFilter" onchange="filterMaps()">
                        <option value="ALL">All Maps</option>
                        <option value="COMPETITIVE">Competitive Active</option>
                        <option value="UNRATED">Unrated / Swiftplay</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div id="arsenalsControls" class="container mb-4" style="display: none;">
        <div class="row g-3 align-items-center justify-content-between">
            <div class="col-12 col-md-3">
                <div class="input-group">
                    <label class="input-group-text bg-dark text-white border-secondary" for="arsenalFilter">Category</label>
                    <select class="form-select bg-dark text-white border-secondary" id="arsenalFilter" onchange="filterArsenals()">
                        <option value="ALL">All Arsenal</option>
                        <option value="Assault Rifles">Assault Rifles</option>
                        <option value="Heavy Weapons">Heavy Weapons</option>
                        <option value="Shotguns">Shotguns</option>
                        <option value="Smgs">SMGS</option>
                        <option value="Sniper Rifles">Sniper Rifles</option>
                        <option value="Sidearms">Sidearms</option>
                        <option value="Melee">Melee</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4" id="parent">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Loading Agents...</span>
                </div>
                <div class="mt-3 text-secondary">Fetching Valorant Agents...</div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="agentModal" tabindex="-1" aria-labelledby="agentModalLabel">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-uppercase" id="modalAgentName">Agent Name</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-4">
                        <div class="col-12 col-md-5 text-center">
                            <img id="modalAgentFull" src="" class="img-fluid rounded mb-3" alt="Full Portrait" draggable="false" style="height: 350px; width: auto;">
                            <div id="modalRoleBadge" class="badge bg-danger fs-6 px-3 py-2 text-uppercase">Role</div>
                        </div>
                        <div class="col-12 col-md-7">
                            <h6 class="text-danger fw-bold text-uppercase">Biography</h6>
                            <p id="modalAgentDesc" class="small text-light leading-relaxed">Agent description here.</p>
                            
                            <h6 class="text-danger fw-bold text-uppercase mt-4">Special Abilities</h6>
                            <div id="modalAbilities" class="d-flex flex-column gap-2">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        let allAgents = [];
        let filteredAgents = [];
        let allMaps = [];
        let filteredMaps = [];
        let allArsenal = [];
        let filteredArsenal = [];
        let page = 1;
        const perPageLoad = 8;
        let lastPage = 1;
        let currentTab = 'agents';

        let cachedMaps = null;
        let cachedArsenal = null;

        const elParent = document.getElementById("parent");
        const elCurrentPage = document.getElementById("currentPage");
        const elBtnPrev = document.getElementById("btnPrev");
        const elBtnNext = document.getElementById("btnNext");
        const agentModal = new bootstrap.Modal(document.getElementById('agentModal'));

        function capitalize(str) {
            if (!str) return '';
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function switchTab(tab, element) {
            currentTab = tab;

            document.querySelectorAll('.nav-link').forEach(el => {
                el.classList.remove('text-white', 'fw-semibold', 'active');
                el.classList.add('text-white-50');
            });
            element.classList.remove('text-white-50');
            element.classList.add('text-white', 'fw-semibold', 'active');

            document.getElementById('agentControls').style.display = (tab === 'agents') ? 'block' : 'none';
            document.getElementById('mapsControls').style.display = (tab === 'maps') ? 'block' : 'none';
            document.getElementById('arsenalsControls').style.display = (tab === 'arsenal') ? 'block' : 'none';

            if (tab === 'agents') {
                renderPage();
            } else if (tab === 'maps') {
                getMaps();
            } else if (tab === 'arsenal') {
                getArsenal();
            }
        }

        const getAgents = async () => {
            try {
                const response = await fetch('https://valorant-api.com/v1/agents?isPlayableCharacter=true');
                const result = await response.json();
                
                allAgents = result.data.sort((a, b) => a.displayName.localeCompare(b.displayName));
                filteredAgents = [...allAgents];
                
                renderPage();
            } catch (error) {
                console.error("Error fetching Valorant agents:", error);
                elParent.innerHTML = `
                    <div class="col-12 text-center text-danger py-5">
                        <h4>Failed to load agent roster!</h4>
                        <p class="text-secondary">Please check your network connection and try again.</p>
                    </div>
                `;
            }
        };

        function renderPage() {
            if (currentTab !== 'agents') return;
            elParent.innerHTML = '';

            lastPage = Math.ceil(filteredAgents.length / perPageLoad) || 1;
            if (page > lastPage) page = lastPage;
            if (page < 1) page = 1;

            elCurrentPage.innerHTML = `${page} / ${lastPage}`;

            if (filteredAgents.length === 0) {
                elParent.innerHTML = `
                    <div class="col-12 text-center text-muted py-5">
                        <h5>No agents found matching this role.</h5>
                    </div>
                `;
                updatePaginationControls();
                return;
            }

            const startIndex = (page - 1) * perPageLoad;
            const endIndex = Math.min(startIndex + perPageLoad, filteredAgents.length);
            const currentSlice = filteredAgents.slice(startIndex, endIndex);

            currentSlice.forEach((agent) => {
                const name = agent.displayName;
                const role = agent.role ? agent.role.displayName : 'Unknown';
                const roleIcon = agent.role ? agent.role.displayIcon : '';
                const portrait = agent.displayIcon || agent.bustPortrait || '';
                const description = agent.description || 'No data available.';

                elParent.innerHTML += `
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card agent-card p-2" onclick="openAgentModal('${agent.uuid}')" style="cursor: pointer; background-color: #1F2326; border: 1px solid #323A40;">
                            <div class="agent-img-wrapper rounded bg-secondary bg-opacity-10 text-center py-2">
                                <img class="agent-portrait img-fluid" draggable="false" src="${portrait}" alt="${name}" style="height: 180px; object-fit: contain;" onerror="this.src='https://placehold.co/200x200/1F2326/FF4655?text=No+Image'">
                            </div>
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <div>
                                    <div class="d-flex align-items-center justify-content-between mb-2">
                                        <h5 class="card-title fw-bold text-white mb-0">${name}</h5>
                                        ${roleIcon ? `<img src="${roleIcon}" alt="${role}" title="${role}" width="20" height="20" style="filter: brightness(0) invert(1);">` : ''}
                                    </div>
                                    <span class="badge role-badge mb-2 text-danger border border-danger bg-transparent">${role}</span>
                                    <p class="card-text text-secondary small text-truncate-2" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 38px;">
                                        ${description}
                                    </p>
                                </div>
                                <button class="btn btn-sm btn-outline-danger w-100 mt-3 text-uppercase fw-bold">View Specs</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            updatePaginationControls();
        }

        async function getMaps() {
            if (cachedMaps) {
                allMaps = cachedMaps;
                filteredMaps = [...allMaps];
                renderMaps();
                return;
            }

            elParent.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
                    <div class="mt-3 text-secondary">Loading Valorant Maps...</div>
                </div>
            `;

            try {
                const response = await fetch('https://valorant-api.com/v1/maps');
                const result = await response.json();
                
                cachedMaps = result.data
                    .filter(m => m.splash)
                    .sort((a, b) => a.displayName.localeCompare(b.displayName));

                allMaps = cachedMaps;
                filteredMaps = [...allMaps];
                renderMaps();
            } catch (error) {
                elParent.innerHTML = `<div class="col-12 text-center text-danger py-5"><h5>Failed to load maps.</h5></div>`;
            }
        }

        function renderMaps() {
            if (currentTab !== 'maps') return;
            elParent.innerHTML = '';

            const competitiveMapNames = ["Abyss", "Bind", "Corrode", "Haven", "Lotus", "Summit", "Sunset"];

            if (filteredMaps.length === 0) {
                elParent.innerHTML = `<div class="col-12 text-center text-muted py-5"><h5>No maps found for this filter.</h5></div>`;
                return;
            }

            filteredMaps.forEach(map => {
                const name = map.displayName;
                const splash = map.splash;
                const coord = map.coordinates || 'Unknown Location';
                
                const isCompetitive = competitiveMapNames.includes(name);
                const badgeText = isCompetitive ? 'Competitive Active' : 'Unrated / Swiftplay';
                const badgeColor = isCompetitive ? 'bg-danger' : 'bg-secondary';

                elParent.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card shadow-sm bg-dark text-white border-secondary h-100">
                            <img src="${splash}" class="card-img-top" alt="${name}" style="height: 180px; object-fit: cover;" draggable="false">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title fw-bold text-danger">${name}</h5>
                                    <p class="card-text small text-secondary mb-1"><i class="bi bi-geo-alt"></i> ${coord}</p>
                                </div>
                                <span class="badge ${badgeColor} text-uppercase mt-2 align-self-start">${badgeText}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function getArsenal() {
            if (cachedArsenal) {
                allArsenal = cachedArsenal;
                filteredArsenal = [...allArsenal];
                renderArsenal();
                return;
            }

            elParent.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
                    <div class="mt-3 text-secondary">Loading Valorant Arsenal...</div>
                </div>
            `;

            try {
                const response = await fetch('https://valorant-api.com/v1/weapons');
                const result = await response.json();

                cachedArsenal = result.data.sort((a, b) => a.displayName.localeCompare(b.displayName));
                allArsenal = cachedArsenal;
                filteredArsenal = [...allArsenal];
                renderArsenal();
            } catch (error) {
                elParent.innerHTML = `<div class="col-12 text-center text-danger py-5"><h5>Failed to load arsenal.</h5></div>`;
            }
        }

        function renderArsenal() {
            if (currentTab !== 'arsenal') return;
            elParent.innerHTML = '';

            if (filteredArsenal.length === 0) {
                elParent.innerHTML = `<div class="col-12 text-center text-muted py-5"><h5>No weapons found for this category.</h5></div>`;
                return;
            }

            filteredArsenal.forEach(weapon => {
                const name = weapon.displayName;
                const icon = weapon.displayIcon;
                
                let rawCategory = weapon.shopData ? weapon.shopData.categoryText : "Melee";
                if (rawCategory.includes('::')) {
                    rawCategory = rawCategory.split('::')[1];
                }

                const cost = weapon.shopData ? weapon.shopData.cost : 'N/A';

                elParent.innerHTML += `
                    <div class="col-12 col-md-6 col-lg-3 mb-4">
                        <div class="card shadow-sm bg-dark text-white border-secondary text-center p-3 h-100 d-flex flex-column justify-content-between">
                            <div>
                                <div style="height: 100px;" class="d-flex align-items-center justify-content-center">
                                    <img src="${icon}" class="img-fluid" alt="${name}" style="max-height: 80px; object-fit: contain;" onerror="this.style.display='none'" draggable="false">
                                </div> 
                                <h6 class="card-title fw-bold text-danger mt-3 mb-1">${name}</h6>
                                <span class="badge bg-secondary text-uppercase mb-2" style="font-size: 0.65rem;">${rawCategory}</span>
                            </div>
                            ${cost !== 'N/A' ? `<div class="text-warning small fw-bold">🪙 ${cost} Credits</div>` : `<div class="text-muted small">Free / Ability</div>`}
                        </div>
                    </div>
                `;
            });
        }

        function filterArsenals() {
            const selectedVal = document.getElementById("arsenalFilter").value;

            if (selectedVal === "ALL") {
                filteredArsenal = [...allArsenal];
            } else {
                filteredArsenal = allArsenal.filter(weapon => {
                    const category = weapon.shopData ? weapon.shopData.categoryText.toLowerCase() : "melee";
                    const target = selectedVal.toLowerCase();
                    
                    return category.includes(target) || (target === "rifles" && category.includes("assault"));
                });
            }

            renderArsenal();
        }

        function updatePaginationControls() {
            if (page <= 1) {
                elBtnPrev.classList.add('disabled');
            } else {
                elBtnPrev.classList.remove('disabled');
            }

            if (page >= lastPage) {
                elBtnNext.classList.add('disabled');
            } else {
                elBtnNext.classList.remove('disabled');
            }
        }

        function filterRole() {
            const selectedRole = document.getElementById("roleFilter").value;
            if (selectedRole === "ALL") {
                filteredAgents = [...allAgents];
            } else {
                filteredAgents = allAgents.filter(a => a.role && a.role.displayName === selectedRole);
            }
            page = 1;
            renderPage();
        }

        function filterMaps() {
            const selectedVal = document.getElementById("mapFilter").value;
            const competitiveMapNames = ["Abyss", "Bind", "Corrode", "Haven", "Lotus", "Summit", "Sunset"];

            if (selectedVal === "ALL") {
                filteredMaps = [...allMaps];
            } else if (selectedVal === "COMPETITIVE") {
                filteredMaps = allMaps.filter(m => competitiveMapNames.includes(m.displayName));
            } else if (selectedVal === "UNRATED") {
                filteredMaps = allMaps.filter(m => !competitiveMapNames.includes(m.displayName));
            }
            renderMaps();
        }

        function prev() {
            if (page > 1) {
                page--;
                renderPage();
            }
        }

        function next() {
            if (page < lastPage) {
                page++;
                renderPage();
            }
        }

        function openAgentModal(uuid) {
            const agent = allAgents.find(a => a.uuid === uuid);
            if (!agent) return;

            document.getElementById('modalAgentName').innerText = agent.displayName;
            document.getElementById('modalAgentFull').src = agent.fullPortrait || agent.displayIcon;
            document.getElementById('modalAgentDesc').innerText = agent.description;
            document.getElementById('modalRoleBadge').innerText = agent.role ? agent.role.displayName : 'Unknown';

            const abilitiesContainer = document.getElementById('modalAbilities');
            abilitiesContainer.innerHTML = '';

            if (agent.abilities && agent.abilities.length > 0) {
                agent.abilities.forEach(ability => {
                    if (ability.displayName && ability.description) {
                        abilitiesContainer.innerHTML += `
                            <div class="ability-box p-2 d-flex align-items-start gap-2 bg-dark rounded border border-secondary">
                                ${ability.displayIcon ? `<img src="${ability.displayIcon}" width="30" height="30" class="mt-1" style="filter: brightness(0) invert(1);" alt="${ability.displayName}">` : ''}
                                <div>
                                    <div class="fw-bold text-white small">${ability.displayName}</div>
                                    <div class="text-secondary" style="font-size: 0.75rem;">${ability.description}</div>
                                </div>
                            </div>
                        `;
                    }
                });
            } else {
                abilitiesContainer.innerHTML = `<div class="text-muted small">No ability specifications found.</div>`;
            }

            agentModal.show();
        }

        const agentModalEl = document.getElementById('agentModal');
        if (agentModalEl) {
            agentModalEl.addEventListener('hide.bs.modal', function () {
                if (document.activeElement instanceof HTMLElement) {
                    document.activeElement.blur();
                }
            });
        }

        getAgents();
    </script>
</body>

</html>
