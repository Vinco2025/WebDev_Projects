<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Specs - Valorant INFO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/glincker/thesvg@main/public/icons/valorant/default.svg">
    <link rel="stylesheet" href="assets3/css3/style.css">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-dark bg-black px-4 shadow-sm">
        <a class="navbar-brand fw-bold text-danger" href="API.html">AGENTS INFORMATION</a>
        <a href="API.html" class="btn btn-outline-secondary btn-sm" style="color: white; font-weight: 600; border: 2px solid;">Back to Home</a>
    </nav>

    <div class="container my-5" id="agentDetailsContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-danger" style="width: 3rem; height: 3rem;" role="status"></div>
            <div class="mt-3 text-secondary">Loading Agent Specs...</div>
        </div>
    </div>

    <script>
        async function fetchAgentDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const uuid = urlParams.get('uuid');
            const container = document.getElementById('agentDetailsContainer');

            if (!uuid) {
                container.innerHTML = `<div class="text-center text-danger"><h3>No agent specified.</h3><a href="API.html" class="btn btn-secondary mt-3">Return Home</a></div>`;
                return;
            }

            try {
                const [agentRes, spraysRes] = await Promise.all([
                    fetch(`https://valorant-api.com/v1/agents/${uuid}`),
                    fetch(`https://valorant-api.com/v1/sprays`)
                ]);

                const agentResult = await agentRes.json();
                const spraysResult = await spraysRes.json();
                
                const agent = agentResult.data;

                let abilitiesHTML = '';
                agent.abilities.forEach(ability => {
                    if (!ability.displayName) return; 
                    abilitiesHTML += `
                        <div class="col-12 col-md-6 col-lg-3">
                            <div class="ability-card p-4 rounded h-100 d-flex flex-column text-center text-md-start">
                                <div class="d-flex align-items-center justify-content-center justify-content-md-start mb-3">
                                    ${ability.displayIcon ? `<img src="${ability.displayIcon}" alt="${ability.displayName}" style="width: 48px; height: 48px;" class="p-1 bg-dark rounded border border-secondary">` : ''}
                                </div>
                                <h5 class="fw-bold text-danger mb-2">${ability.displayName}</h5>
                                <p class="small text-secondary m-0" style="line-height: 1.5;">${ability.description || 'No description available.'}</p>
                            </div>
                        </div>
                    `;
                });

                const agentSprays = spraysResult.data.filter(spray => {
                    const name = spray.displayName.toLowerCase();
                    const agentName = agent.displayName.toLowerCase();
                    return name.includes(agentName) && spray.fullTransparentIcon;
                });

                let spraysHTML = '';
                if (agentSprays.length > 0) {
                    agentSprays.forEach(spray => {
                        spraysHTML += `
                            <div class="col-6 col-md-4 col-lg-3 text-center">
                                <div class="p-3 bg-black border border-secondary rounded h-100 d-flex flex-column align-items-center justify-content-center">
                                    <img src="${spray.fullTransparentIcon || spray.displayIcon}" alt="${spray.displayName}" style="max-height: 80px; object-fit: contain;" class="mb-2" draggable="false">
                                    <span class="small text-light fw-bold">${spray.displayName}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    spraysHTML = `<div class="text-secondary small">No specific promotional sprays found for this agent.</div>`;
                }

                container.innerHTML = `
                    <div class="agent-hero-section p-4 p-md-5 mb-5">
                        <div class="row align-items-center">
                            <div class="col-12 col-md-5 text-center mb-4 mb-md-0 position-relative">
                                <div class="position-absolute top-50 start-50 translate-middle rounded-circle bg-danger opacity-10 filter-blur" style="width: 250px; height: 250px; filter: blur(50px); z-index: 0;"></div>
                                <img src="${agent.fullPortrait || agent.displayIcon}" alt="${agent.displayName}" class="img-fluid position-relative" style="max-height: 420px; object-fit: contain; z-index: 1;" draggable="false">
                            </div>
                            <div class="col-12 col-md-7 ps-md-4">
                                <span class="badge bg-danger text-uppercase px-3 py-2 mb-3">${agent.role ? agent.role.displayName : 'Agent'}</span>
                                <h1 class="display-3 fw-bold text-white text-uppercase mb-3">${agent.displayName}</h1>
                                <p class="lead text-secondary mb-4" style="line-height: 1.7;">${agent.description}</p>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h3 class="fw-bold text-white text-uppercase m-0">Special Abilities</h3>
                        <div style="height: 2px; background: #323A40; flex-grow: 1; margin-left: 20px;"></div>
                    </div>
                    <div class="row g-4 mb-5">
                        ${abilitiesHTML}
                    </div>

                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h3 class="fw-bold text-white text-uppercase m-0">Signature Sprays & Flair</h3>
                        <div style="height: 2px; background: #323A40; flex-grow: 1; margin-left: 20px;"></div>
                    </div>
                    <div class="row g-3">
                        ${spraysHTML}
                    </div>
                `;

            } catch (error) {
                console.error("Error fetching agent specs:", error);
                container.innerHTML = `<div class="text-center text-danger"><h3>Failed to load agent details.</h3></div>`;
            }
        }

        fetchAgentDetails();
    </script>
</body>
</html>
