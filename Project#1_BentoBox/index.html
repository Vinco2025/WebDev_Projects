<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BentoBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid py-2">
        <div class="text-center mb-5">
            <h1 class="mb-0">Pokemon Gallery</h1>
        </div>

        <div class="row gx-2 gy-2 mb-3">
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/rowlet.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/mimi.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>  
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/vulpix.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/pikachu.jpeg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/evee.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
        </div>

        <div class="row gx-2 gy-2">
            <div class="col-12 col-lg-3 d-flex flex-column gap-3">
                <div class="card bg-black border-secondary overflow-hidden" style="height: 250px;">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/bulbasaur.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <div class="card bg-black border-secondary h-100 overflow-hidden" style="height: 300px; min-height: 300px; max-height: 300px;">
                            <div class="card-body p-0 d-flex justify-content-center align-items-center">
                                <img src="assets/images/bulbasaur_window.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                            </div>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="card bg-black border-secondary h-100 overflow-hidden" style="height: 300px; min-height: 300px; max-height: 300px;">
                            <div class="card-body p-0 d-flex justify-content-center align-items-center">
                                <img src="assets/images/lantern.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card bg-black border-secondary h-100 overflow-hidden" style="min-height: 400px;">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/pikachu1.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>

            <div class="col-12 col-lg-3 d-flex flex-column gap-3">
                <div class="card bg-black border-secondary p-0 overflow-hidden flex-fill">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/y.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
                <div class="card bg-black border-secondary p-0 overflow-hidden flex-fill">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/pikachu3.jpg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
