<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BentoBox</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid py-2">
        <div class="text-center mb-5">
            <h1 class="mb-0">Pokemon Gallery</h1>
        </div>

        <div class="row g-3">
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/rowlet.jpg" alt="Pokemon" class="w-100 h-100 object-fit-contain" draggable="false">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-2">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                        <img src="assets/images/pikachu.jpeg" alt="Pokemon" class="w-100 h-100 object-fit-cover" draggable="false">
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-3">
                <div class="card border-secondary bg-black overflow-hidden" style="height: 250px">
                    <div class="card-body p-0 d-flex justify-content-center align-items-center">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
